[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openprotect"
version = "0.1.0"
description = "Open-source Python obfuscation framework with a PyArmor-compatible workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "openprotect contributors" }]
keywords = ["obfuscator", "protection", "bytecode", "pyarmor-compatible"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
openprotect = "openprotect.cli:main"
pyarmor = "openprotect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
